name = "cenro-functions-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"


[vars]
# Non-secret public configuration.
# Keep secrets like PLANTNET_API_KEY in Cloudflare as a secret, not in this file.
FIREBASE_PROJECT_ID = "cenro-4b48e"
CLOUDINARY_CLOUD_NAME = "dfo5l4d4t"
ADMIN_ORIGINS = "http://localhost:3000"

# Optional PlantNet project (used in identify endpoint). Default in worker is `all`.
# PLANTNET_PROJECT = "all"

# Optional bark/trunk classifier fusion (see ../bark_classifier_service/README.md).
# Leave unset to disable fusion with zero behavior change.
# BARK_CLASSIFIER_URL = "https://bark-species-classifier-xxxxx.run.app"
# BARK_CLASSIFIER_TIMEOUT_MS = "8000"

[observability.logs]
enabled = true
invocation_logs = true

